window.guestLogin=async()=>{try{await signInAnonymously(auth)}catch(e){alert('게스트 로그인이 아직 설정되지 않았습니다. Firebase 인증에서 익명 로그인 방식을 활성화해 주세요.')}};
window.authForm=mode=>view(`<section class="card"><button class="back" onclick="authChoice()">‹</button><h2>${mode==='login'?'로그인':'간편 회원가입'}</h2><label>아이디</label><input id="loginId" placeholder="영문·숫자 3자 이상">${mode==='signup'?'<p class="note">아이디와 비밀번호만 입력하면 가입됩니다.</p>':''}<label>비밀번호</label><input id="pw" type="password" placeholder="6자 이상"><button class="primary" onclick="submitAuth('${mode}')">${mode==='login'?'로그인':'회원가입 완료'}</button><button class="soft" onclick="googleLogin()">Google로 계속하기</button></section>`);
window.submitAuth=async mode=>{const id=$('loginId').value.trim().toLowerCase(),p=$('pw').value,e=id+'@resail.local';if(!/^[a-z0-9_]{3,30}$/.test(id)||p.length<6)return alert('아이디는 영문·숫자·_ 3자 이상, 비밀번호는 6자 이상 입력해 주세요.');try{if(mode==='login')await signInWithEmailAndPassword(auth,e,p);else{const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'profiles',c.user.uid),{email:e,displayName:id,shipyard:'',location:'',role,createdAt:serverTimestamp()})}}catch(x){alert(x.message)}};
window.googleLogin=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){alert('Google 로그인에 실패했습니다: '+e.message)}};
async function ensureProfile(){if(!auth.currentUser)return;if(auth.currentUser.isAnonymous){me={displayName:'게스트',role:'guest',shipyard:'게스트 이용',location:'위치 정보는 회원 가입 후 등록'};return}const ref=doc(db,'profiles',auth.currentUser.uid),old=await getDoc(ref);if(!old.exists())await setDoc(ref,{email:auth.currentUser.email||'',displayName:auth.currentUser.displayName||'Google 회원',shipyard:'',location:'',role:role||'ship',createdAt:serverTimestamp()});me=(await getDoc(ref)).data()}
function home(){view(`<section class="hero"><img class="mascot" src="https://gyeongbingim82-creator.github.io/sealink-vessel/sundi.png?v=2" onerror="this.outerHTML='⚓'"><div>등록 회원 · 위치 기반 대화</div><h1>${esc(me?.displayName||auth.currentUser.email)}님, 환영합니다</h1><p>${esc(me?.shipyard||'정보 미등록')} · ${esc(me?.location||'위치 미등록')}</p></section><div class="actions"><button class="action" onclick="compose()">📣 <b>모집공고</b><span>연결이 필요한 내용을 공개로 등록</span></button><button class="action" onclick="partners()">💬 <b>대화방</b><span>등록 선박·폐선 조선소와 1:1 대화</span></button></div><div class="title"><h2>모집공고</h2><button class="soft" onclick="compose()">공고 작성</button></div><section id="posts" class="card">불러오는 중...</section>`);unsub=onSnapshot(collection(db,'posts'),snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('posts').innerHTML=rows.length?rows.map(p=>{const company=p.role==='company'||p.authorRole==='업체 회원';return `<article class="post ${company?'post-company':'post-ship'}"><span class="post-role">${company?'🏭 업체 모집공고':'⚓ 선주 모집공고'}</span><div class="row"><h3>${esc(p.title)}</h3>${p.authorId===auth.currentUser.uid?`<button class="danger" onclick="removePost('${p.id}')">공고 내리기</button>`:''}</div><p>${esc(p.body)}</p><span class="meta">${esc(p.author||'')} · ${time(p.createdAt)}</span><button class="soft" onclick="openPostChat('${p.id}','${encodeURIComponent(p.title)}')">공고 문의 대화</button></article>`}).join(''):'<div class="empty">아직 등록된 모집공고가 없습니다.</div>'},()=>{$('posts').textContent='게시글을 불러오지 못했습니다.'})}
window.compose=()=>view(`<section class="card"><button class="back" onclick="home()">‹</button><h2>공개 연결글 작성</h2><p class="note">작성한 글은 모든 회원이 볼 수 있습니다.</p><label>제목</label><input id="title" placeholder="예: 폐선 견적 업체를 찾습니다"><label>내용</label><textarea id="body" rows="7" placeholder="선박 상태와 필요한 연결 내용을 작성해 주세요."></textarea><button class="primary" onclick="publish()">연결글 올리기</button></section>`);
window.publish=async()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body)return alert('제목과 내용을 입력해 주세요.');try{await addDoc(collection(db,'posts'),{title,body,author:auth.currentUser.email,authorId:auth.currentUser.uid,role:me.role,createdAt:serverTimestamp()});home()}catch(e){alert('글 저장 실패: '+e.message)}};
window.removePost=async id=>{if(confirm('이 글을 내릴까요?')){try{await deleteDoc(doc(db,'posts',id))}catch(e){alert('글을 내리지 못했습니다.')}}};
window.partners=async()=>{view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>대화방 · 등록 조선소/선박</h2></div><p class="note">등록된 조선소와 선박의 위치를 확인하고 1:1 대화하세요.</p><div class="card"><h3>이용 가능 폐선 조선소 안내</h3><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>부산 해양 재활용 조선소</h3><p>폐선 해체·재활용 상담<br>📍 부산광역시 영도구</p></div><button class="soft" onclick="openMap('부산광역시 영도구')">위치 보기</button></article><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>남해 선박 해체센터</h3><p>선박 매각·해체 견적 상담<br>📍 경상남도 통영시</p></div><button class="soft" onclick="openMap('경상남도 통영시')">위치 보기</button></article></div><h3>등록 회원 대화방</h3><div id="members" class="card">불러오는 중...</div></section>`);try{const ss=await getDocs(collection(db,'profiles')),users=ss.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>x.uid!==auth.currentUser.uid);$('members').innerHTML=users.length?users.map(u=>`<article class="member ${u.role==='company'?'company':''}"><div class="avatar">${u.role==='ship'?'⚓':'🏢'}</div><div class="info"><h3>${esc(u.displayName||u.email)}</h3><p>${u.role==='ship'?'선박':'폐선 조선소'} · ${esc(u.shipyard||'정보 미등록')}<br>📍 ${esc(u.location||'위치 미등록')}</p></div><div><button class="soft" onclick="openMap('${encodeURIComponent(u.location||'')}')">위치 보기</button><button class="primary" onclick="startChat('${u.uid}','${encodeURIComponent(u.displayName||u.email)}')">대화하기</button></div></article>`).join(''):'<div class="empty">아직 다른 회원이 등록되지 않았습니다.</div>'}catch(e){$('members').textContent='회원 목록을 불러오지 못했습니다. Firestore 규칙을 확인해 주세요.'}};
window.openMap=place=>{if(!place)return alert('등록된 위치 정보가 없습니다.');window.open('https://www.google.com/maps/search/?api=1&query='+place,'_blank')};
window.shipyardDetail=kind=>{const data=kind==='busan'?{name:'부산 해양 재활용 조선소',place:'부산광역시 영도구',service:'폐선 해체, 고철·자재 재활용, 해체 일정 상담',prepare:'선박 종류, 톤수, 현재 정박 위치'}:{name:'남해 선박 해체센터',place:'경상남도 통영시',service:'선박 매각 상담, 폐선 견적 검토, 해체 진행 안내',prepare:'선박 규모, 상태, 희망 진행 시기'};view(`<section class="card"><button class="back" onclick="partners()">‹</button><div class="avatar">🏗️</div><h2>${data.name}</h2><p class="note">조선소 서비스 안내</p><p><b>주요 서비스</b><br>${data.service}</p><p><b>상담 전 준비 정보</b><br>${data.prepare}</p><p><b>위치</b><br>📍 ${data.place}</p><div class="row"><button class="primary" onclick="openMap('${data.place}')">지도에서 위치 보기</button><button class="soft" onclick="openSupportChat()">상담하기</button></div></section>`)};
new MutationObserver(()=>document.querySelectorAll('.member.company').forEach(card=>{if(card.dataset.detailReady)return;const title=card.querySelector('h3')?.textContent||'';const kind=title.includes('부산')?'busan':'namhae';card.dataset.detailReady='1';card.classList.add('clickable');card.addEventListener('click',e=>{if(e.target.closest('button'))return;window.shipyardDetail(kind)})})).observe(app,{childList:true,subtree:true});
window.openSupportChat=async()=>{try{const id='bot_'+auth.currentUser.uid;await setDoc(doc(db,'threads',id),{members:[auth.currentUser.uid,'resail-bot'],title:'Re:sail 1:1 상담 챗봇',createdAt:serverTimestamp()},{merge:true});chat(id,'Re:sail 1:1 상담 챗봇')}catch(e){alert('대화방을 열지 못했습니다: '+e.message)}};
window.openPostChat=async(id,title)=>{try{await setDoc(doc(db,'threads','post_'+id),{members:['public'],title:decodeURIComponent(title),createdAt:serverTimestamp()},{merge:true});chat('post_'+id,decodeURIComponent(title)+' 문의 대화방')}catch(e){alert('대화방을 열지 못했습니다: '+e.message)}};
window.addReply=async postId=>{const body=prompt('공고에 남길 댓글을 입력하세요.');if(!body?.trim())return;try{await addDoc(collection(db,'posts',postId,'replies'),{body:body.trim(),author:me?.displayName||auth.currentUser.email,authorId:auth.currentUser.uid,createdAt:serverTimestamp()});alert('댓글을 등록했습니다.')}catch(e){alert('댓글 등록에 실패했습니다: '+e.message)}};
window.addReplyByTitle=async title=>{const s=await getDocs(collection(db,'posts'));const row=s.docs.find(d=>d.data().title===title);if(row)window.addReply(row.id)};
new MutationObserver(()=>document.querySelectorAll('.post').forEach(p=>{if(p.dataset.replyReady)return;p.dataset.replyReady='1';const b=document.createElement('button');b.className='soft';b.textContent='댓글 달기';b.onclick=()=>window.addReplyByTitle(p.querySelector('h3')?.textContent||'');p.appendChild(b)})).observe(app,{childList:true,subtree:true});
window.partners=()=>view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>대화방</h2></div><div class="card"><h3>Re:sail 상담 대화방</h3><p class="note">폐선 절차, 견적 요청, 조선소 위치와 회원 이용 방법을 1:1로 안내하는 상담 챗봇입니다.</p><button class="primary" onclick="openSupportChat()">상담 대화방 들어가기</button></div><div class="card"><h3>이용 가능 폐선 조선소</h3><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>부산 해양 재활용 조선소</h3><p><b>전문 서비스</b> · 폐선 해체, 고철·자재 재활용, 해체 일정 상담<br><b>상담 준비</b> · 선박 종류, 톤수, 현재 정박 위치를 알려 주세요.<br>부산 영도구의 폐선 해체·재활용 상담 조선소입니다. 선박 상태 확인부터 해체 일정, 자재 재활용까지 단계별로 안내합니다.<br>📍 부산광역시 영도구</p></div><button class="soft" onclick="openMap('부산광역시 영도구')">위치 보기</button></article><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>남해 선박 해체센터</h3><p><b>전문 서비스</b> · 선박 매각 상담, 폐선 견적 검토, 해체 진행 안내<br><b>상담 준비</b> · 선박 규모, 상태, 희망 진행 시기를 알려 주세요.<br>경남 통영시 기반의 선박 매각·폐선 견적 상담 센터입니다. 선박 규모와 상태에 맞는 해체·매각 방향을 제안합니다.<br>📍 경상남도 통영시</p></div><button class="soft" onclick="openMap('경상남도 통영시')">위치 보기</button></article></div><div class="card"><h3>회원 간 1:1 대화</h3><p class="note">회원가입한 선박과 업체는 이곳에서 상대 회원과 대화할 수 있습니다.</p><button class="primary" onclick="memberChats()">등록 회원 찾기</button></div></section>`);
window.memberChats=async()=>{try{const s=await getDocs(collection(db,'profiles')),u=s.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>x.uid!==auth.currentUser.uid);view(`<section><button class="back" onclick="partners()">‹</button><h2>등록 회원</h2>${u.length?u.map(x=>`<article class="member"><div class="avatar">${x.role==='ship'?'⚓':'🏢'}</div><div class="info"><h3>${esc(x.displayName||x.email)}</h3><p>${esc(x.location||'위치 미등록')}</p></div><button class="primary" onclick="startChat('${x.uid}','${encodeURIComponent(x.displayName||x.email)}')">대화하기</button></article>`).join(''):'<div class="empty">등록 회원이 없습니다.</div>'}</section>`)}catch(e){alert('회원 목록을 불러오지 못했습니다.')}};
window.startChat=async(uid,name)=>{const id=[auth.currentUser.uid,uid].sort().join('_'),ref=doc(db,'threads',id);try{if(!(await getDoc(ref)).exists())await setDoc(ref,{members:[auth.currentUser.uid,uid],createdAt:serverTimestamp()});chat(id,decodeURIComponent(name))}catch(e){alert('대화방을 만들지 못했습니다: '+e.message)}};
function chat(id,name){view(`<section class="chat"><div class="title"><button class="back" onclick="partners()">‹</button><h2>${esc(name)} 님과의 대화</h2></div><div id="messages" class="messages"><div class="empty">대화를 불러오는 중...</div></div><div class="chatbar"><input id="message" placeholder="메시지를 입력하세요." onkeydown="if(event.key==='Enter')sendMessage('${id}')"><button class="primary" onclick="sendMessage('${id}')">전송</button></div></section>`);unsub=onSnapshot(query(collection(db,'threads',id,'messages'),orderBy('createdAt','asc')),s=>{$('messages').innerHTML=s.docs.length?s.docs.map(d=>{const m=d.data();return `<div class="bubble ${m.authorId===auth.currentUser.uid?'mine':''}">${esc(m.body)}<div class="meta">${time(m.createdAt)}</div></div>`}).join(''):'<div class="empty">첫 메시지를 보내 대화를 시작해 보세요.</div>';$('messages').scrollTop=$('messages').scrollHeight},e=>{$('messages').textContent='대화를 불러오지 못했습니다.'})}
const botReply=q=>{q=q.toLowerCase();if(q.includes('견적')||q.includes('비용'))return '견적 상담을 위해 선박 종류, 톤수, 현재 위치를 알려주세요.';if(q.includes('절차')||q.includes('폐선'))return '폐선은 상담 신청 → 현장 확인 → 견적 제안 → 계약 → 해체·재활용 순서로 진행됩니다.';if(q.includes('위치')||q.includes('조선소'))return '대화방 메뉴의 이용 가능 폐선 조선소에서 위치 보기 버튼을 눌러 지도를 확인할 수 있습니다.';if(q.includes('회원')||q.includes('가입'))return '회원가입은 아이디와 비밀번호만 입력하면 완료됩니다.';return '안녕하세요, Re:sail 상담 챗봇입니다. 폐선 절차, 견적, 조선소 위치, 회원가입 중 궁금한 내용을 말씀해 주세요.'};
window.sendMessage=async id=>{const input=$('message'),body=input.value.trim();if(!body)return;input.value='';try{await addDoc(collection(db,'threads',id,'messages'),{body,authorId:auth.currentUser.uid,author:auth.currentUser.email,createdAt:serverTimestamp()});if(id.startsWith('bot_'))setTimeout(()=>addDoc(collection(db,'threads',id,'messages'),{body:botReply(body),authorId:'resail-bot',author:'Re:sail 상담 챗봇',createdAt:serverTimestamp()}),350)}catch(e){alert('메시지를 보내지 못했습니다.')}};

window.publish=async()=>{const title=$('title').value.trim(),body=$('body').value.trim(),file=$('postPhoto')?.files?.[0];if(!title||!body)return alert('제목과 내용을 입력해 주세요.');try{let photoUrl='';if(file){if(file.size>5*1024*1024)return alert('사진은 5MB 이하로 첨부해 주세요.');const fileRef=storageRef(storage,`post-photos/${auth.currentUser.uid}/${Date.now()}-${file.name}`);await uploadBytes(fileRef,file);photoUrl=await getDownloadURL(fileRef)}await addDoc(collection(db,'posts'),{title,body,photoUrl,author:auth.currentUser.email,authorId:auth.currentUser.uid,role:me.role,reactions:[],createdAt:serverTimestamp()});home()}catch(e){alert('글 저장 실패: '+e.message)}};
window.reactPost=async(postId,emoji='👍')=>{try{const post=await getDoc(doc(db,'posts',postId)),data=post.data()||{},reactions=Array.isArray(data.reactions)?data.reactions:[],key=`${auth.currentUser.uid}:${emoji}`,next=reactions.includes(key)?reactions.filter(x=>x!==key):[...reactions,key];await setDoc(doc(db,'posts',postId),{reactions:next},{merge:true});const b=document.querySelector(`[data-react="${postId}"]`);if(b)b.textContent=`${emoji} ${next.filter(x=>x.endsWith(':'+emoji)).length}`}catch(e){alert('반응을 저장하지 못했습니다: '+e.message)}};
const postObserver=new MutationObserver(async()=>{const root=$('posts');if(!root)return;const snap=await getDocs(collection(db,'posts')).catch(()=>null);if(!snap)return;const byTitle=new Map(snap.docs.map(d=>[d.data().title,{id:d.id,...d.data()}]));root.querySelectorAll('.post').forEach(article=>{if(article.dataset.enhanced)return;const title=article.querySelector('h3')?.textContent||'',p=byTitle.get(title);if(!p)return;article.dataset.enhanced='1';if(p.photoUrl){const image=document.createElement('img');image.className='post-photo';image.src=p.photoUrl;image.alt='게시글 첨부 사진';article.insertBefore(image,article.querySelector('.meta'))}const b=document.createElement('button');b.className='soft reaction';b.dataset.react=p.id;b.textContent=`👍 ${(p.reactions||[]).filter(x=>x.endsWith(':👍')).length}`;b.onclick=()=>reactPost(p.id);article.appendChild(b)})});postObserver.observe(app,{childList:true,subtree:true});
window.publish=async()=>{const title=$('title').value.trim(),body=$('body').value.trim(),file=$('postPhoto')?.files?.[0];if(!title||!body)return alert('제목과 내용을 입력해 주세요.');try{let photoUrl='';if(file){if(file.size>5*1024*1024)return alert('사진은 5MB 이하로 첨부해 주세요.');const fileRef=storageRef(storage,`post-photos/${auth.currentUser.uid}/${Date.now()}-${file.name}`);await uploadBytes(fileRef,file);photoUrl=await getDownloadURL(fileRef)}const authorName=me?.displayName||auth.currentUser.email||'알 수 없는 회원',authorRole=me?.role==='company'?'업체 회원':me?.role==='ship'?'선박 회원':'게스트';await addDoc(collection(db,'posts'),{title,body,photoUrl,author:authorName,authorName,authorRole,authorEmail:auth.currentUser.email||'',authorId:auth.currentUser.uid,role:me.role,reactions:[],createdAt:serverTimestamp()});home()}catch(e){alert('글 저장 실패: '+e.message)}};

window.toggleReaction=async(postId,emoji)=>{try{const p=await getDoc(doc(db,'posts',postId)),r=Array.isArray(p.data()?.reactions)?p.data().reactions:[],key=`${auth.currentUser.uid}:${emoji}`,next=r.includes(key)?r.filter(x=>x!==key):[...r,key];await setDoc(doc(db,'posts',postId),{reactions:next},{merge:true});const b=document.querySelector(`[data-reaction="${postId}-${emoji}"]`);if(b)b.textContent=`${emoji} ${next.filter(x=>x.endsWith(':'+emoji)).length}`}catch(e){alert('반응을 저장하지 못했습니다.')}};
window.toggleBookmark=async(postId,title)=>{try{const ref=doc(db,'profiles',auth.currentUser.uid),p=await getDoc(ref),old=p.data()?.bookmarks||[],has=old.some(x=>x.id===postId),next=has?old.filter(x=>x.id!==postId):[...old,{id:postId,title}];await setDoc(ref,{bookmarks:next},{merge:true});me={...(p.data()||{}),bookmarks:next};const b=document.querySelector(`[data-bookmark="${postId}"]`);if(b)b.textContent=has?'🔖 찜하기':'🔖 찜함';const count=document.querySelector('.header-icon[title="찜한 공고"] span');if(count)count.textContent=String(next.length);renderBookmarks()}catch(e){alert('찜하기를 저장하지 못했습니다.')}};

const interactionObserver=new MutationObserver(()=>document.querySelectorAll('.post').forEach(article=>{if(article.dataset.interactions)return;const rb=article.querySelector('[data-react]');if(!rb)return;const id=rb.dataset.react,title=article.querySelector('h3')?.textContent||'';article.dataset.interactions='1';const wrap=document.createElement('div');wrap.className='post-actions';for(const [emoji,label] of [['👍','좋아요'],['❤️','하트']]){const b=document.createElement('button');b.className='soft';b.dataset.reaction=`${id}-${emoji}`;b.textContent=`${emoji} 0`;b.title=label;b.onclick=()=>toggleReaction(id,emoji);wrap.appendChild(b)}const save=document.createElement('button');save.className='soft';save.dataset.bookmark=id;save.textContent=(me?.bookmarks||[]).some(x=>x.id===id)?'🔖 찜함':'🔖 찜하기';save.onclick=()=>toggleBookmark(id,title);wrap.appendChild(save);article.appendChild(wrap)}));interactionObserver.observe(app,{childList:true,subtree:true});

const memberListBase=window.memberChats;window.filterMembers=()=>{const q=($('memberSearch')?.value||'').trim().toLowerCase();document.querySelectorAll('#memberResults .member-item').forEach(card=>{card.style.display=(card.dataset.search||'').includes(q)?'flex':'none'})};window.memberChats=async()=>{await memberListBase();const section=document.querySelector('#app section');if(!section||$('memberSearch'))return;const input=document.createElement('input');input.id='memberSearch';input.className='member-search';input.placeholder='🔍 사용자·업체·선박·위치 검색';input.oninput=filterMembers;const heading=section.querySelector('h2');if(heading)heading.insertAdjacentElement('afterend',input);const cards=[...section.querySelectorAll('.member-item')];cards.forEach(card=>{const text=card.textContent.toLowerCase();card.dataset.search=text});const wrap=document.createElement('div');wrap.id='memberResults';cards.forEach(card=>wrap.appendChild(card));section.appendChild(wrap)};
window.vesselNumberGate=()=>view(`<section class="vessel-gate"><img src="./sundi.png" alt="선디"><small>VESSEL REGISTRATION</small><h1>본인의 선박 번호는 무엇인가요?</h1><p>선박을 확인하고 맞춤형 폐선·조선소 연결 서비스를 제공하기 위해 필요합니다.</p><label>선박 번호</label><input id="vesselNumber" placeholder="예: 부산 123456호" autocomplete="off"><button class="primary" onclick="saveVesselNumber()">선박 번호 등록하고 시작하기</button><button class="soft" onclick="logout()">로그아웃</button></section>`);

window.saveVesselNumber=async()=>{const number=$('vesselNumber')?.value.trim();if(!number)return alert('선박 번호를 입력해 주세요.');try{await setDoc(doc(db,'profiles',auth.currentUser.uid),{vesselNumber:number,updatedAt:serverTimestamp()},{merge:true});me={...me,vesselNumber:number};showAuthenticatedHome()}catch(e){alert('선박 번호를 저장하지 못했습니다: '+e.message)}};
window.companyRegistrationGate=()=>view(`<section class="vessel-gate company-gate"><img src="./sundi.png" alt="선디"><small>COMPANY REGISTRATION</small><h1>업체 정보를 등록해 주세요</h1><p>선박 이용자에게 정확한 업체 정보가 표시되도록 기본 정보를 입력해 주세요.</p><label>회사 이름</label><input id="companyName" value="${esc(me?.shipyard||'')}" placeholder="예: 부산 해양조선"><label>회사 위치</label><input id="companyLocation" value="${esc(me?.location||'')}" placeholder="예: 부산광역시 영도구"><label>회사 전화번호</label><input id="companyPhone" type="tel" value="${esc(me?.phone||'')}" placeholder="예: 051-123-4567"><button class="primary" onclick="saveCompanyRegistration()">업체 등록하고 시작하기</button><button class="soft" onclick="logout()">로그아웃</button></section>`);
window.saveCompanyRegistration=async()=>{const name=$('companyName')?.value.trim(),location=$('companyLocation')?.value.trim(),phone=$('companyPhone')?.value.trim();if(!name||!location||!phone)return alert('회사 이름, 위치, 전화번호를 모두 입력해 주세요.');try{await setDoc(doc(db,'profiles',auth.currentUser.uid),{shipyard:name,location,phone,companyRegistered:true,updatedAt:serverTimestamp()},{merge:true});me={...me,shipyard:name,location,phone,companyRegistered:true};showAuthenticatedHome()}catch(e){alert('업체 정보를 저장하지 못했습니다: '+e.message)}};
let signupInProgress=false;window.submitAuth=async mode=>{const id=$('loginId').value.trim().toLowerCase(),p=$('pw').value,e=id+'@resail.local';if(!/^[a-z0-9_]{3,30}$/.test(id)||p.length<6)return alert('아이디는 영문·숫자·_ 3자 이상, 비밀번호는 6자 이상 입력해 주세요.');try{if(mode==='login'){await signInWithEmailAndPassword(auth,e,p);return}signupInProgress=true;const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'profiles',c.user.uid),{email:e,displayName:id,shipyard:'',location:'',role,createdAt:serverTimestamp()});await signOut(auth);signupInProgress=false;alert('회원가입이 완료되었습니다. 가입한 아이디로 로그인해 주세요.');authForm('login')}catch(x){signupInProgress=false;alert(x.message)}};
onAuthStateChanged(auth,async u=>{stop();if(signupInProgress)return;if(!u){me=null;$('user').textContent='선박·폐선 업체 연결 플랫폼';landing();return}await ensureProfile();if(me?.role==='ship'&&!me?.vesselNumber){$('user').textContent='⚓ 선박 번호 등록';vesselNumberGate();return}if(me?.role==='company'&&!me?.companyRegistered){$('user').textContent='🏭 업체 정보 등록';companyRegistrationGate();return}showAuthenticatedHome()});Object.assign(window,{landing,authChoice,home,chat});window.logout=()=>signOut(auth);landing();
const heartOnlyObserver=new MutationObserver(async()=>{document.querySelectorAll('.post').forEach(article=>{article.querySelectorAll('[data-react]').forEach(b=>b.remove());article.querySelectorAll('[data-reaction]').forEach(b=>{if(b.dataset.reaction.endsWith('-👍'))b.remove()})});const root=$('posts');if(!root||root.dataset.heartsLoaded)return;root.dataset.heartsLoaded='1';const s=await getDocs(collection(db,'posts')).catch(()=>null);if(!s)return;s.docs.forEach(d=>{const b=document.querySelector(`[data-reaction="${d.id}-❤️"]`),r=d.data().reactions||[];if(b)b.textContent=`❤️ ${r.filter(x=>x.endsWith(':❤️')).length}`})});heartOnlyObserver.observe(app,{childList:true,subtree:true});
window.refreshComments=async postId=>{const box=document.querySelector(`[data-comments="${postId}"]`);if(!box)return;try{const s=await getDocs(query(collection(db,'threads','post_'+postId,'messages'),orderBy('createdAt','asc'))),rows=s.docs.map(d=>d.data()).filter(x=>x.kind==='comment');box.innerHTML=rows.length?rows.map(x=>`<div class="comment"><b>${esc(x.author||'회원')}</b><p>${esc(x.body)}</p><span>${time(x.createdAt)}</span></div>`).join(''):'<p class="note">아직 댓글이 없습니다.</p>'}catch(e){box.innerHTML='<p class="note">댓글을 불러오지 못했습니다.</p>'}};
window.addReply=async postId=>{const body=prompt('공고에 남길 댓글을 입력하세요.');if(!body?.trim())return;try{await setDoc(doc(db,'threads','post_'+postId),{title:'공고 댓글',members:['public'],createdAt:serverTimestamp()},{merge:true});await addDoc(collection(db,'threads','post_'+postId,'messages'),{body:body.trim(),author:me?.displayName||auth.currentUser.email||'게스트',authorId:auth.currentUser.uid,kind:'comment',createdAt:serverTimestamp()});await refreshComments(postId)}catch(e){alert('댓글 등록에 실패했습니다: '+e.message)}};
const commentDisplayObserver=new MutationObserver(()=>document.querySelectorAll('.post').forEach(article=>{if(article.dataset.commentsReady)return;const heart=article.querySelector('[data-reaction$="-❤️"]');if(!heart)return;const id=heart.dataset.reaction.replace(/-❤️$/,'');article.dataset.commentsReady='1';const title=document.createElement('h4');title.className='comment-title';title.textContent='댓글';const box=document.createElement('div');box.className='comments';box.dataset.comments=id;article.append(title,box);refreshComments(id)}));commentDisplayObserver.observe(app,{childList:true,subtree:true});

window.profilePage=()=>view(`<section class="card"><button class="back" onclick="home()">‹</button><h2>👤 마이페이지</h2><div class="profile-summary"><img id="profilePhotoPreview" class="profile-photo" src="${esc(me?.photoUrl||'./sundi.png')}" alt="내 프로필 사진"><span class="role-badge">${me?.role==='company'?'업체 이용자':me?.role==='guest'?'게스트':'선박 이용자'}</span><h3>${esc(me?.displayName||auth.currentUser?.email||'회원')}</h3><p>${me?.role==='company'?'폐선 업체':'선박'} · ${esc(me?.shipyard||'정보 미등록')}<br>📍 ${esc(me?.location||'위치 미등록')}</p></div><label>프로필 사진</label><input id="profilePhotoFile" type="file" accept="image/*" onchange="previewProfilePhoto(event)"><p class="note">5MB 이하의 사진을 등록할 수 있습니다.</p><label>표시 이름</label><input id="profileName" value="${esc(me?.displayName||'')}"><label>선박명 또는 폐선 조선소명</label><input id="profileYard" value="${esc(me?.shipyard||'')}" placeholder="예: 부산 해양조선"><label>위치</label><input id="profileLocation" value="${esc(me?.location||'')}" placeholder="예: 부산광역시 영도구"><button class="primary" onclick="saveProfile()">정보 저장</button></section>`);
window.saveProfile=async()=>{try{const file=$('profilePhotoFile')?.files?.[0];let photoUrl=me?.photoUrl||'';if(file){if(file.size>5*1024*1024)return alert('프로필 사진은 5MB 이하로 등록해 주세요.');const fileRef=storageRef(storage,`profile-photos/${auth.currentUser.uid}/${Date.now()}-${file.name}`);await uploadBytes(fileRef,file);photoUrl=await getDownloadURL(fileRef)}await setDoc(doc(db,'profiles',auth.currentUser.uid),{...me,displayName:$('profileName').value.trim()||auth.currentUser.email,shipyard:$('profileYard').value.trim(),location:$('profileLocation').value.trim(),photoUrl,email:auth.currentUser.email||'',updatedAt:serverTimestamp()},{merge:true});me=(await getDoc(doc(db,'profiles',auth.currentUser.uid))).data();alert('프로필 정보를 저장했습니다.');home()}catch(e){alert('프로필 저장에 실패했습니다: '+e.message)}};
const memberChatsWithPhoto=window.memberChats;window.memberChats=async()=>{await memberChatsWithPhoto();const s=await getDocs(collection(db,'profiles')).catch(()=>null);if(!s)return;const byName=new Map(s.docs.map(d=>{const x=d.data();return [x.displayName||x.email,x]}));document.querySelectorAll('.member-item').forEach(card=>{const name=card.querySelector('h3')?.textContent||'',p=byName.get(name);if(p?.photoUrl){const a=card.querySelector('.avatar');if(a)a.innerHTML=`<img src="${p.photoUrl}" alt="${esc(name)} 프로필 사진">`}})};

window.profilePage=()=>{const company=me?.role==='company';view(`<section class="card profile-form"><button class="back" onclick="home()">‹</button><h2>👤 마이페이지 상세 정보</h2><div class="profile-summary"><img id="profilePhotoPreview" class="profile-photo" src="${esc(me?.photoUrl||'./sundi.png')}" alt="내 프로필 사진"><span class="role-badge">${company?'업체 이용자':me?.role==='guest'?'게스트':'선박 이용자'}</span><h3>${esc(me?.displayName||auth.currentUser?.email||'회원')}</h3><p>${esc(me?.introduction||'등록된 소개가 없습니다.')}</p></div><label>프로필 사진</label><input id="profilePhotoFile" type="file" accept="image/*" onchange="previewProfilePhoto(event)"><label>표시 이름</label><input id="profileName" value="${esc(me?.displayName||'')}"><label>${company?'업체명':'선박명'}</label><input id="profileYard" value="${esc(me?.shipyard||'')}"><label>연락처</label><input id="profilePhone" type="tel" value="${esc(me?.phone||'')}" placeholder="예: 010-1234-5678"><label>위치·주소</label><input id="profileLocation" value="${esc(me?.location||'')}" placeholder="예: 부산광역시 영도구"><label>상세 소개</label><textarea id="profileIntroduction" rows="5" placeholder="보유 선박이나 업체의 특징과 상담 가능한 내용을 작성해 주세요.">${esc(me?.introduction||'')}</textarea>${company?`<label>대표자명</label><input id="profileRepresentative" value="${esc(me?.representative||'')}"><label>주요 서비스</label><textarea id="profileServices" rows="3" placeholder="예: 폐선 견적, 선박 해체, 고철 재활용">${esc(me?.services||'')}</textarea><label>운영시간</label><input id="profileHours" value="${esc(me?.businessHours||'')}" placeholder="예: 평일 09:00~18:00">`:`<div class="row"><div><label>선박 종류</label><input id="profileVesselType" value="${esc(me?.vesselType||'')}" placeholder="예: 어선"></div><div><label>톤수</label><input id="profileTonnage" value="${esc(me?.tonnage||'')}" placeholder="예: 20톤"></div></div><div class="row"><div><label>건조연도</label><input id="profileBuiltYear" value="${esc(me?.builtYear||'')}" placeholder="예: 2008년"></div><div><label>선박 상태</label><input id="profileCondition" value="${esc(me?.vesselCondition||'')}" placeholder="예: 운항 가능"></div></div>`}<button class="primary" onclick="saveProfileDetailed()">상세 정보 저장</button></section>`)};
window.saveProfileDetailed=async()=>{try{const file=$('profilePhotoFile')?.files?.[0];let photoUrl=me?.photoUrl||'';if(file){if(file.size>5*1024*1024)return alert('프로필 사진은 5MB 이하로 등록해 주세요.');const fileRef=storageRef(storage,`profile-photos/${auth.currentUser.uid}/${Date.now()}-${file.name}`);await uploadBytes(fileRef,file);photoUrl=await getDownloadURL(fileRef)}const company=me?.role==='company',data={...me,displayName:$('profileName').value.trim()||auth.currentUser.email,shipyard:$('profileYard').value.trim(),phone:$('profilePhone').value.trim(),location:$('profileLocation').value.trim(),introduction:$('profileIntroduction').value.trim(),photoUrl,email:auth.currentUser.email||'',updatedAt:serverTimestamp()};if(company){data.representative=$('profileRepresentative').value.trim();data.services=$('profileServices').value.trim();data.businessHours=$('profileHours').value.trim()}else{data.vesselType=$('profileVesselType').value.trim();data.tonnage=$('profileTonnage').value.trim();data.builtYear=$('profileBuiltYear').value.trim();data.vesselCondition=$('profileCondition').value.trim()}await setDoc(doc(db,'profiles',auth.currentUser.uid),data,{merge:true});me=(await getDoc(doc(db,'profiles',auth.currentUser.uid))).data();alert('상세 정보를 저장했습니다.');profilePage()}catch(e){alert('상세 정보 저장에 실패했습니다: '+e.message)}};
window.toggleComments=postId=>{const box=document.querySelector(`[data-comments="${postId}"]`);if(!box)return;box.dataset.expanded=box.dataset.expanded==='1'?'0':'1';refreshComments(postId)};
window.refreshComments=async postId=>{const box=document.querySelector(`[data-comments="${postId}"]`);if(!box)return;try{const s=await getDocs(query(collection(db,'threads','post_'+postId,'messages'),orderBy('createdAt','asc'))),rows=s.docs.map(d=>d.data()).filter(x=>x.kind==='comment'),expanded=box.dataset.expanded==='1',visible=expanded?rows:rows.slice(0,3);box.innerHTML=visible.length?visible.map(x=>`<div class="comment"><b>${esc(x.author||'회원')}</b><p>${esc(x.body)}</p><span>${time(x.createdAt)}</span></div>`).join(''):'<p class="note">아직 댓글이 없습니다.</p>';if(rows.length>3){const more=document.createElement('button');more.className='comment-more';more.textContent=expanded?'댓글 접기':`댓글 더보기 (${rows.length-3})`;more.onclick=()=>toggleComments(postId);box.appendChild(more)}}catch(e){box.innerHTML='<p class="note">댓글을 불러오지 못했습니다.</p>'}};
window.refreshNotificationBadge=async()=>{if(!auth.currentUser||!me)return;try{const s=await getDocs(collection(db,'threads')),read=me.readNotifications||[],rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.members||[]).includes(auth.currentUser.uid)||(x.members||[]).includes('public')),count=rows.filter(x=>!read.includes(x.id)).length;const btn=document.querySelector('.header-icon.notify');if(btn){let badge=btn.querySelector('span');if(!badge){badge=document.createElement('span');btn.appendChild(badge)}badge.textContent=String(count);badge.hidden=count===0}}catch(e){}};
window.markNotificationRead=async(id,title)=>{try{const read=me?.readNotifications||[],next=read.includes(id)?read:[...read,id];await setDoc(doc(db,'profiles',auth.currentUser.uid),{readNotifications:next},{merge:true});me={...me,readNotifications:next};await refreshNotificationBadge();chat(id,title)}catch(e){alert('알림 확인 상태를 저장하지 못했습니다.')}};
window.showNotifications=async()=>{view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>🔔 대화 알림</h2></div><div id="notificationList" class="card">알림을 불러오는 중...</div></section>`);try{const s=await getDocs(collection(db,'threads')),read=me?.readNotifications||[],rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.members||[]).includes(auth.currentUser.uid)||(x.members||[]).includes('public'));$('notificationList').innerHTML=rows.length?rows.map(x=>{const done=read.includes(x.id),title=x.title||'1대1 대화';return `<article class="saved-row notification-row ${done?'read':''}"><div><b>${done?'✓ ':''}${esc(title)}</b><p class="note">${done?'확인 완료':'새 메시지와 문의 내용을 확인해 보세요.'}</p></div><button class="${done?'read-button':'soft'}" onclick="markNotificationRead('${x.id}','${encodeURIComponent(title)}')">${done?'다시 보기':'확인하기'}</button></article>`}).join(''):'<div class="empty">새로운 대화 알림이 없습니다.</div>'}catch(e){$('notificationList').innerHTML='<div class="empty">알림을 불러오지 못했습니다.</div>'}};
const notificationHeaderObserver=new MutationObserver(()=>{const user=$('user'),btn=user?.querySelector('.header-icon.notify');if(btn&&!user.dataset.noticeLoaded){user.dataset.noticeLoaded='1';refreshNotificationBadge()}else if(!btn&&user)delete user.dataset.noticeLoaded});notificationHeaderObserver.observe($('user'),{childList:true,subtree:true});
Object.values(shipyardInfo).forEach(x=>{x.image='./ship-dismantling-center.png';if(x.phone&&!x.desc.includes(x.phone))x.desc+=` ☎ ${x.phone}`});
window.showSavedPage=()=>{const list=me?.bookmarks||[];view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>🔖 찜한 공고</h2></div><div class="card">${list.length?list.map(x=>`<article class="saved-row"><div><b>${esc(x.title)}</b><p class="note">찜한 공고의 문의 대화방으로 이동합니다.</p></div><button class="primary" onclick="openPostChat('${x.id}','${encodeURIComponent(x.title)}')">공고 보기</button></article>`).join(''):'<div class="empty">아직 찜한 공고가 없습니다.</div>'}</div></section>`)};
window.showNotifications=async()=>{view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>🔔 대화 알림</h2></div><div id="notificationList" class="card">알림을 불러오는 중...</div></section>`);try{const s=await getDocs(collection(db,'threads')),rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.members||[]).includes(auth.currentUser.uid)||(x.members||[]).includes('public'));$('notificationList').innerHTML=rows.length?rows.map(x=>`<article class="saved-row"><div><b>${esc(x.title||'1대1 대화')}</b><p class="note">새 메시지와 문의 내용을 확인해 보세요.</p></div><button class="soft" onclick="chat('${x.id}','${encodeURIComponent(x.title||'대화방')}')">확인하기</button></article>`).join(''):'<div class="empty">새로운 대화 알림이 없습니다.</div>'}catch(e){$('notificationList').innerHTML='<div class="empty">알림을 불러오지 못했습니다.</div>'}};
window.applyRoleUI=()=>{if(!me)return;const company=me.role==='company';document.body.classList.toggle('company-mode',company);document.body.classList.toggle('ship-mode',!company&&me.role!=='guest');const user=$('user');if(user&&!user.querySelector('.account-role')){const badge=document.createElement('span');badge.className='account-role';badge.textContent=company?'🏭 폐선 업체 회원':me.role==='guest'?'👤 게스트':'⚓ 선박 회원';user.prepend(badge)}const hero=document.querySelector('.hero');if(hero&&!hero.querySelector('.role-banner')){const banner=document.createElement('div');banner.className='role-banner';banner.textContent=company?'🏭 폐선 업체 전용 페이지':me.role==='guest'?'👤 게스트 이용':'⚓ 선박 이용자 전용 페이지';hero.prepend(banner)}};
window.ensureBottomNav=()=>{if(document.getElementById('mobileNav'))return;const nav=document.createElement('nav');nav.id='mobileNav';nav.className='mobile-nav';nav.innerHTML=`<button onclick="home()"><span>⌂</span><b>홈</b></button><button onclick="home();setTimeout(()=>document.querySelector('.title')?.scrollIntoView({behavior:'smooth'}),100)"><span>📣</span><b>공고</b></button><button onclick="partners()"><span>💬</span><b>대화방</b></button><button onclick="showSavedPage()"><span>🔖</span><b>찜목록</b></button><button onclick="showNotifications()"><span>🔔</span><b>알림</b></button>`;document.querySelector('.app').appendChild(nav)};
window.removeBottomNav=()=>document.getElementById('mobileNav')?.remove();
new MutationObserver(()=>{if($('user')?.querySelector('button')){ensureBottomNav();applyRoleUI()}else removeBottomNav()}).observe($('user'),{childList:true,subtree:true});new MutationObserver(()=>{if(auth.currentUser)applyRoleUI()}).observe(app,{childList:true,subtree:true});if($('user')?.querySelector('button')){ensureBottomNav();applyRoleUI()};
const homeBeforeDealerLayout=window.home;window.home=()=>{homeBeforeDealerLayout();setTimeout(()=>{if(document.querySelector('.dealer-layout'))return;const hero=document.querySelector('.hero'),actions=document.querySelector('.actions');if(!hero)return;const company=me?.role==='company',layout=document.createElement('section');layout.className='dealer-layout';layout.innerHTML=`<button class="dealer-main-card" onclick="${company?"document.querySelector('.title')?.scrollIntoView({behavior:'smooth'})":"compose()"}"><small>${company?'BUSINESS MATCHING':'VESSEL DISPOSAL'}</small><h2>${company?'처리할 선박 공고를 확인하세요':'처리할 선박이 있으신가요?'}</h2><p>${company?'공개 공고를 확인하고 선박 이용자와 바로 상담하세요.':'선박 정보를 등록하고 조선소와 안전하게 연결하세요.'}</p><b>${company?'모집공고 확인하기':'처리할 선박 등록하기'} →</b></button><div class="dealer-steps"><span><b>1</b> 정보 등록</span><span><b>2</b> 업체·견적 확인</span><span><b>3</b> 1대1 상담</span></div><div class="dealer-shortcuts"><button onclick="home();setTimeout(()=>document.querySelector('.title')?.scrollIntoView({behavior:'smooth'}),100)"><span>📣</span><b>모집공고</b><small>공개 연결글 보기</small></button><button onclick="partners()"><span>🏗️</span><b>조선소</b><small>위치·정보 확인</small></button><button onclick="memberChats()"><span>💬</span><b>1대1 대화</b><small>사용자 검색</small></button><button onclick="profilePage()"><span>${company?'🏭':'⚓'}</span><b>내 정보</b><small>상세정보 관리</small></button></div>`;hero.insertAdjacentElement('afterend',layout);actions?.remove()},0)};
</script></body></html>
