<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Re:sail | 선박·폐선 업체 연결</title>
  <style>
    :root{--navy:#102b4d;--blue:#356fa9;--sky:#eaf4ff;--gold:#f3c65e;--cream:#fffaf0;--line:#d8e4ef;--muted:#61738a;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#eff6fc;color:var(--navy);font-family:Arial,'Noto Sans KR',sans-serif}.app{max-width:1120px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 70px #173d6717}.top{height:82px;padding:0 42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:25px;letter-spacing:1.5px;font-weight:700}.brand b{font-weight:900}.brand:before{content:'⚓';display:inline-grid;place-items:center;width:35px;height:35px;margin-right:10px;border-radius:11px;background:var(--blue);color:#fff;font-size:20px}.user{font-size:13px;color:var(--muted)}main{max-width:920px;margin:auto;padding:48px 38px}.landing{min-height:calc(100vh - 82px);display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.panel{border:0;padding:64px 10%;text-align:left;cursor:pointer;background:var(--sky);color:var(--navy);font:inherit}.panel.company{background:#fff5df}.panel:hover{filter:brightness(.98)}.panel small{font-weight:800;color:var(--blue);letter-spacing:1px}.panel.company small{color:#a66f16}.panel strong{display:block;font-size:40px;margin:16px 0 10px}.panel span{color:#506b88;line-height:1.7}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;margin:15px 0}.hero{border-radius:26px;padding:34px;background:linear-gradient(120deg,#102b4d,#356fa9);color:#fff}.hero h1{margin:8px 0;font-size:34px}.hero p{margin:0;color:#dceaff}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0}.action{border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;background:#fff;font:inherit;cursor:pointer;color:var(--navy)}.action:hover{box-shadow:0 10px 24px #173d6718}.action b{display:block;font-size:18px;margin:7px 0}.action span{color:var(--muted);font-size:13px}.title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}.title h2{font-size:21px;margin:0}.post{border-top:1px solid var(--line);padding:18px 0}.post h3{margin:0 0 8px}.post p{line-height:1.6;margin:0 0 8px}.meta{font-size:12px;color:var(--muted)}button{border:0;border-radius:12px;padding:13px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.soft{background:#e8f2fc;color:var(--blue)}.danger{background:#fff0ef;color:#bb433b;padding:8px 11px;font-size:12px}.back{background:#fff;border:1px solid var(--line);font-size:20px;padding:7px 13px}input,textarea,select{display:block;width:100%;padding:13px 14px;margin:7px 0 15px;border-radius:11px;border:1px solid #cbd9e7;font:inherit}label{font-size:13px;font-weight:bold}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.member{display:flex;align-items:center;gap:15px;border:1px solid var(--line);border-radius:17px;padding:17px;margin:10px 0}.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#e6f1fb;font-size:23px}.member.company .avatar{background:#fff1d4}.member .info{flex:1}.member h3{margin:0 0 5px;font-size:16px}.member p{margin:0;font-size:13px;color:var(--muted)}.chat{height:calc(100vh - 180px);min-height:510px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:12px 0}.bubble{max-width:72%;width:max-content;padding:13px 15px;margin:8px 0;border-radius:16px;background:#f0f5fa;line-height:1.5}.bubble.mine{margin-left:auto;background:var(--blue);color:#fff}.chatbar{display:flex;gap:8px}.chatbar input{margin:0}.empty{padding:28px;text-align:center;color:var(--muted)}.note{font-size:13px;color:var(--muted)}.mascot{width:90px;height:90px;object-fit:contain;float:right;margin:-8px 0 0 20px}@media(max-width:680px){.top{padding:0 20px;height:70px}.brand{font-size:20px}main{padding:28px 20px}.landing{grid-template-columns:1fr}.panel{padding:42px 12%}.panel strong{font-size:31px}.actions{grid-template-columns:1fr}.chat{height:calc(100vh - 145px)}.row{display:block}.row button{width:100%;margin-top:7px}}
  </style>
</head>
<body><div class="app"><header class="top"><div class="brand">Re:<b>sail</b></div><div id="user" class="user">선박·폐선 업체 연결 플랫폼</div></header><main id="app"></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import{getFirestore,collection,doc,setDoc,getDoc,addDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,where,getDocs}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
const fb=initializeApp({apiKey:'AIzaSyAJqwse098x-e8Vh7HYY7l7k0NfGBAPrgE',authDomain:'re-sail.firebaseapp.com',projectId:'re-sail',storageBucket:'re-sail.firebasestorage.app',messagingSenderId:'354900083905',appId:'1:354900083905:web:654fc1fb651c2579d24040'}),auth=getAuth(fb),db=getFirestore(fb),$=x=>document.getElementById(x);let role='',me=null,screen='landing',unsub=null;
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const time=v=>v?.toDate?v.toDate().toLocaleString('ko-KR'):'';
function stop(){if(unsub){unsub();unsub=null}}function view(html){stop();$('app').innerHTML=html}
function landing(){view(`<section class="landing"><button class="panel" onclick="choose('ship')"><small>VESSEL MEMBER</small><strong>선박 페이지</strong><span>선박을 등록하고 폐선 업체·관련 회사와 연결하세요.</span></button><button class="panel company" onclick="choose('company')"><small>BUSINESS MEMBER</small><strong>업체 페이지</strong><span>폐선 업체를 등록하고 선박 회원과 바로 대화하세요.</span></button></section>`)}
window.choose=r=>{role=r;authChoice()};function authChoice(){view(`<section class="card"><button class="back" onclick="landing()">‹</button><h2>${role==='ship'?'선박':'폐선 업체'} 회원</h2><div class="actions"><button class="action" onclick="authForm('login')">🔐 <b>로그인</b><span>기존 계정으로 들어가기</span></button><button class="action" onclick="authForm('signup')">📝 <b>회원가입</b><span>선박·조선소 정보를 등록하기</span></button></div></section>`)}
window.authForm=mode=>view(`<section class="card"><button class="back" onclick="authChoice()">‹</button><h2>${mode==='login'?'로그인':'회원가입'}</h2>${mode==='signup'?`<label>표시 이름</label><input id="name" placeholder="회사명 또는 선박명"><label>${role==='company'?'폐선 조선소명':'선박명'}</label><input id="yard" placeholder="예: 부산 해양조선"><label>위치</label><input id="location" placeholder="예: 부산광역시 영도구">`:''}<label>이메일</label><input id="email" type="email" placeholder="name@example.com"><label>비밀번호</label><input id="pw" type="password" placeholder="6자 이상"><button class="primary" onclick="submitAuth('${mode}')">${mode==='login'?'로그인':'회원가입 완료'}</button></section>`);
window.submitAuth=async mode=>{const e=$('email').value.trim(),p=$('pw').value;if(!e||p.length<6)return alert('이메일과 6자 이상 비밀번호를 입력해 주세요.');try{if(mode==='login')await signInWithEmailAndPassword(auth,e,p);else{const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'profiles',c.user.uid),{email:e,displayName:$('name').value.trim()||e,shipyard:$('yard').value.trim(),location:$('location').value.trim(),role,createdAt:serverTimestamp()})}}catch(x){alert(x.message)}};
async function ensureProfile(){if(!auth.currentUser)return;const ref=doc(db,'profiles',auth.currentUser.uid),old=await getDoc(ref);if(!old.exists()){await signOut(auth);alert('회원가입 후 이용해 주세요.');return}me=old.data()}
function home(){view(`<section class="hero"><img class="mascot" src="https://gyeongbingim82-creator.github.io/sealink-vessel/sundi.png?v=2" onerror="this.outerHTML='⚓'"><div>등록 회원 · 위치 기반 대화</div><h1>${esc(me?.displayName||auth.currentUser.email)}님, 환영합니다</h1><p>${esc(me?.shipyard||'정보 미등록')} · ${esc(me?.location||'위치 미등록')}</p></section><div class="actions"><button class="action" onclick="compose()">📣 <b>모집공고</b><span>연결이 필요한 내용을 공개로 등록</span></button><button class="action" onclick="partners()">💬 <b>대화방</b><span>등록 선박·폐선 조선소와 1:1 대화</span></button></div><div class="title"><h2>모집공고</h2><button class="soft" onclick="compose()">공고 작성</button></div><section id="posts" class="card">불러오는 중...</section>`);unsub=onSnapshot(collection(db,'posts'),snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('posts').innerHTML=rows.length?rows.map(p=>`<article class="post"><div class="row"><h3>${esc(p.title)}</h3>${p.authorId===auth.currentUser.uid?`<button class="danger" onclick="removePost('${p.id}')">공고 내리기</button>`:''}</div><p>${esc(p.body)}</p><span class="meta">${esc(p.author||'')} · ${time(p.createdAt)}</span></article>`).join(''):'<div class="empty">아직 등록된 모집공고가 없습니다.</div>'},()=>{$('posts').textContent='게시글을 불러오지 못했습니다.'})}
window.compose=()=>view(`<section class="card"><button class="back" onclick="home()">‹</button><h2>공개 연결글 작성</h2><p class="note">작성한 글은 모든 회원이 볼 수 있습니다.</p><label>제목</label><input id="title" placeholder="예: 폐선 견적 업체를 찾습니다"><label>내용</label><textarea id="body" rows="7" placeholder="선박 상태와 필요한 연결 내용을 작성해 주세요."></textarea><button class="primary" onclick="publish()">연결글 올리기</button></section>`);
window.publish=async()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body)return alert('제목과 내용을 입력해 주세요.');try{await addDoc(collection(db,'posts'),{title,body,author:auth.currentUser.email,authorId:auth.currentUser.uid,role:me.role,createdAt:serverTimestamp()});home()}catch(e){alert('글 저장 실패: '+e.message)}};
window.removePost=async id=>{if(confirm('이 글을 내릴까요?')){try{await deleteDoc(doc(db,'posts',id))}catch(e){alert('글을 내리지 못했습니다.')}}};
window.partners=async()=>{view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>대화방 · 등록 조선소/선박</h2></div><p class="note">등록된 조선소와 선박의 위치를 확인하고 1:1 대화하세요.</p><div class="card"><h3>이용 가능 폐선 조선소 안내</h3><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>부산 해양 재활용 조선소</h3><p>폐선 해체·재활용 상담<br>📍 부산광역시 영도구</p></div><button class="soft" onclick="openMap('부산광역시 영도구')">위치 보기</button></article><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>남해 선박 해체센터</h3><p>선박 매각·해체 견적 상담<br>📍 경상남도 통영시</p></div><button class="soft" onclick="openMap('경상남도 통영시')">위치 보기</button></article></div><h3>등록 회원 대화방</h3><div id="members" class="card">불러오는 중...</div></section>`);try{const ss=await getDocs(collection(db,'profiles')),users=ss.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>x.uid!==auth.currentUser.uid);$('members').innerHTML=users.length?users.map(u=>`<article class="member ${u.role==='company'?'company':''}"><div class="avatar">${u.role==='ship'?'⚓':'🏢'}</div><div class="info"><h3>${esc(u.displayName||u.email)}</h3><p>${u.role==='ship'?'선박':'폐선 조선소'} · ${esc(u.shipyard||'정보 미등록')}<br>📍 ${esc(u.location||'위치 미등록')}</p></div><div><button class="soft" onclick="openMap('${encodeURIComponent(u.location||'')}')">위치 보기</button><button class="primary" onclick="startChat('${u.uid}','${encodeURIComponent(u.displayName||u.email)}')">대화하기</button></div></article>`).join(''):'<div class="empty">아직 다른 회원이 등록되지 않았습니다.</div>'}catch(e){$('members').textContent='회원 목록을 불러오지 못했습니다. Firestore 규칙을 확인해 주세요.'}};
window.openMap=place=>{if(!place)return alert('등록된 위치 정보가 없습니다.');window.open('https://www.google.com/maps/search/?api=1&query='+place,'_blank')};
window.startChat=async(uid,name)=>{const id=[auth.currentUser.uid,uid].sort().join('_'),ref=doc(db,'threads',id);try{if(!(await getDoc(ref)).exists())await setDoc(ref,{members:[auth.currentUser.uid,uid],createdAt:serverTimestamp()});chat(id,decodeURIComponent(name))}catch(e){alert('대화방을 만들지 못했습니다: '+e.message)}};
function chat(id,name){view(`<section class="chat"><div class="title"><button class="back" onclick="partners()">‹</button><h2>${esc(name)} 님과의 대화</h2></div><div id="messages" class="messages"><div class="empty">대화를 불러오는 중...</div></div><div class="chatbar"><input id="message" placeholder="메시지를 입력하세요." onkeydown="if(event.key==='Enter')sendMessage('${id}')"><button class="primary" onclick="sendMessage('${id}')">전송</button></div></section>`);unsub=onSnapshot(query(collection(db,'threads',id,'messages'),orderBy('createdAt','asc')),s=>{$('messages').innerHTML=s.docs.length?s.docs.map(d=>{const m=d.data();return `<div class="bubble ${m.authorId===auth.currentUser.uid?'mine':''}">${esc(m.body)}<div class="meta">${time(m.createdAt)}</div></div>`}).join(''):'<div class="empty">첫 메시지를 보내 대화를 시작해 보세요.</div>';$('messages').scrollTop=$('messages').scrollHeight},e=>{$('messages').textContent='대화를 불러오지 못했습니다.'})}
window.sendMessage=async id=>{const input=$('message'),body=input.value.trim();if(!body)return;input.value='';try{await addDoc(collection(db,'threads',id,'messages'),{body,authorId:auth.currentUser.uid,author:auth.currentUser.email,createdAt:serverTimestamp()})}catch(e){alert('메시지를 보내지 못했습니다.')}};
onAuthStateChanged(auth,async u=>{stop();if(!u){me=null;$('user').textContent='선박·폐선 업체 연결 플랫폼';landing();return}await ensureProfile();$('user').innerHTML=`${esc(u.email)} · <button class="soft" onclick="logout()">로그아웃</button>`;home()});Object.assign(window,{landing,authChoice,home,chat});window.logout=()=>signOut(auth);landing();
</script></body></html>
