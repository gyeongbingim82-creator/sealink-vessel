.chat{height:calc(100vh - 145px)}.row{display:block}.row button{width:100%;margin-top:7px}}
  .member.company{transition:transform .15s,box-shadow .15s}.member.company.clickable{cursor:pointer}.member.company.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px #173d6718}
  @media(max-width:680px){.top{padding:0 16px}.user{font-size:11px}main{padding:22px 14px}.card{padding:18px;border-radius:16px}.member{align-items:flex-start;flex-wrap:wrap;padding:14px;gap:11px}.member .info{min-width:calc(100% - 62px)}.member.company>button,.member.company>div:last-child{width:100%;margin-left:59px}.member.company>div:last-child{display:flex;gap:8px}.member.company>div:last-child button{flex:1}.title{margin:20px 0 10px}.title h2{font-size:18px}}
  .landing-new{min-height:calc(100vh - 82px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--line);position:relative}.landing-copy{grid-column:1/-1;grid-row:1/-1;z-index:2;align-self:center;justify-self:center;width:min(430px,78%);padding:34px 30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 50px #173d6718}.landing-copy img{width:105px;height:105px;object-fit:contain;display:block;margin:0 auto 8px}.landing-copy small{font-weight:800;letter-spacing:2px;color:var(--blue)}.landing-copy h1{font-size:38px;letter-spacing:5px;margin:4px 0 10px}.landing-copy p{line-height:1.7;color:var(--muted);margin:0 0 12px}.landing-copy span{font-size:13px;color:#8a98a8}.landing-choice{border:0;padding:60px 9%;font:inherit;text-align:left;cursor:pointer;color:var(--navy)}.landing-choice.ship{grid-column:1;grid-row:1/-1;background:#eaf4ff;padding-top:180px}.landing-choice.company{grid-column:2;grid-row:1/-1;background:#fff5df;padding-top:180px}.landing-choice>span{font-size:52px;display:block;margin-bottom:18px}.landing-choice small{display:block;font-weight:800;letter-spacing:2px;color:var(--blue)}.landing-choice.company small{color:#a66f16}.landing-choice strong{display:block;font-size:34px;margin:14px 0 8px}.landing-choice p{color:var(--muted);line-height:1.6}.landing-choice b{display:inline-block;margin-top:18px}.yard-card{display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .15s,box-shadow .15s}.yard-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #173d6718}.yard-card>img{width:132px;height:90px;object-fit:cover;border-radius:13px;flex:0 0 132px}.yard-card .info{flex:1}.yard-card .info p{line-height:1.6}.yard-detail>img{width:100%;height:240px;object-fit:cover;border-radius:16px;margin-bottom:18px}.yard-detail h2{margin:5px 0 12px}@media(max-width:680px){.landing-new{display:flex;flex-direction:column;min-height:calc(100vh - 70px);gap:0}.landing-copy{order:0;width:calc(100% - 28px);padding:22px 16px;margin:18px auto 0}.landing-copy img{width:76px;height:76px}.landing-copy h1{font-size:30px}.landing-choice{min-height:210px;padding:26px 30px!important}.landing-choice>span{font-size:38px;margin-bottom:8px}.landing-choice strong{font-size:27px}.yard-card{align-items:flex-start;flex-wrap:wrap}.yard-card>img{width:100%;height:145px;flex-basis:100%}.yard-card .info{width:calc(100% - 0px)}.yard-card>button{width:100%}.yard-detail>img{height:180px}}
  .photo-preview{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:-3px 0 16px}.post-photo{display:block;width:min(100%,520px);max-height:320px;object-fit:cover;border-radius:14px;margin:10px 0 13px}.reaction{margin-top:12px;padding:9px 13px}@media(max-width:680px){.post-photo{max-height:220px}}

<body><div class="app"><header class="top"><div class="brand">Re:<b>sail</b></div><div id="user" class="user">선박·폐선 업체 연결 플랫폼</div></header><main id="app"></main></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInAnonymously,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import{getFirestore,collection,doc,setDoc,getDoc,addDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,where,getDocs}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import{getStorage,ref as storageRef,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js';
const fb=initializeApp({apiKey:'AIzaSyAJqwse098x-e8Vh7HYY7l7k0NfGBAPrgE',authDomain:'re-sail.firebaseapp.com',projectId:'re-sail',storageBucket:'re-sail.firebasestorage.app',messagingSenderId:'354900083905',appId:'1:354900083905:web:654fc1fb651c2579d24040'}),auth=getAuth(fb),db=getFirestore(fb),$=x=>document.getElementById(x);let role='',me=null,screen='landing',unsub=null;
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const time=v=>v?.toDate?v.toDate().toLocaleString('ko-KR'):'';
function stop(){if(unsub){unsub();unsub=null}}function view(html){stop();$('app').innerHTML=html}
function landing(){view(`<section class="landing"><button class="panel" onclick="choose('ship')"><img class="mascot" src="./sundi.png" alt="선디"><small>VESSEL MEMBER</small><strong>선박 관계자이신가요?</strong><span>선박을 등록하고 폐선 업체·관련 회사와 안전하게 연결하세요.</span><br><br><b>선박으로 시작하기 →</b></button><button class="panel company" onclick="choose('company')"><img class="mascot" src="./sundi.png" alt="선디"><small>BUSINESS MEMBER</small><strong>폐선 업체이신가요?</strong><span>조선소를 등록하고 선박 회원과 바로 상담을 시작하세요.</span><br><br><b>업체로 시작하기 →</b></button></section>`)}
window.choose=r=>{role=r;authChoice()};function authChoice(){view(`<section class="card"><button class="back" onclick="landing()">‹</button><h2>${role==='ship'?'선박':'폐선 업체'} 회원</h2><div class="actions"><button class="action" onclick="authForm('login')">🔐 <b>로그인</b><span>기존 계정으로 들어가기</span></button><button class="action" onclick="authForm('signup')">📝 <b>회원가입</b><span>선박·조선소 정보를 등록하기</span></button></div><button class="soft" onclick="guestLogin()">게스트로 둘러보기</button><p class="note">게스트는 공고와 조선소 정보를 확인할 수 있습니다.</p></section>`)}
window.guestLogin=async()=>{try{await signInAnonymously(auth)}catch(e){alert('게스트 로그인이 아직 설정되지 않았습니다. Firebase 인증에서 익명 로그인 방식을 활성화해 주세요.')}};
window.authForm=mode=>view(`<section class="card"><button class="back" onclick="authChoice()">‹</button><h2>${mode==='login'?'로그인':'간편 회원가입'}</h2><label>아이디</label><input id="loginId" placeholder="영문·숫자 3자 이상">${mode==='signup'?'<p class="note">아이디와 비밀번호만 입력하면 가입됩니다.</p>':''}<label>비밀번호</label><input id="pw" type="password" placeholder="6자 이상"><button class="primary" onclick="submitAuth('${mode}')">${mode==='login'?'로그인':'회원가입 완료'}</button><button class="soft" onclick="googleLogin()">Google로 계속하기</button></section>`);
window.submitAuth=async mode=>{const id=$('loginId').value.trim().toLowerCase(),p=$('pw').value,e=id+'@resail.local';if(!/^[a-z0-9_]{3,30}$/.test(id)||p.length<6)return alert('아이디는 영문·숫자·_ 3자 이상, 비밀번호는 6자 이상 입력해 주세요.');try{if(mode==='login')await signInWithEmailAndPassword(auth,e,p);else{const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,'profiles',c.user.uid),{email:e,displayName:id,shipyard:'',location:'',role,createdAt:serverTimestamp()})}}catch(x){alert(x.message)}};
window.googleLogin=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){alert('Google 로그인에 실패했습니다: '+e.message)}};
async function ensureProfile(){if(!auth.currentUser)return;if(auth.currentUser.isAnonymous){me={displayName:'게스트',role:'guest',shipyard:'게스트 이용',location:'위치 정보는 회원 가입 후 등록'};return}const ref=doc(db,'profiles',auth.currentUser.uid),old=await getDoc(ref);if(!old.exists())await setDoc(ref,{email:auth.currentUser.email||'',displayName:auth.currentUser.displayName||'Google 회원',shipyard:'',location:'',role:role||'ship',createdAt:serverTimestamp()});me=(await getDoc(ref)).data()}
function home(){view(`<section class="hero"><img class="mascot" src="https://gyeongbingim82-creator.github.io/sealink-vessel/sundi.png?v=2" onerror="this.outerHTML='⚓'"><div>등록 회원 · 위치 기반 대화</div><h1>${esc(me?.displayName||auth.currentUser.email)}님, 환영합니다</h1><p>${esc(me?.shipyard||'정보 미등록')} · ${esc(me?.location||'위치 미등록')}</p></section><div class="actions"><button class="action" onclick="compose()">📣 <b>모집공고</b><span>연결이 필요한 내용을 공개로 등록</span></button><button class="action" onclick="partners()">💬 <b>대화방</b><span>등록 선박·폐선 조선소와 1:1 대화</span></button></div><div class="title"><h2>모집공고</h2><button class="soft" onclick="compose()">공고 작성</button></div><section id="posts" class="card">불러오는 중...</section>`);unsub=onSnapshot(collection(db,'posts'),snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('posts').innerHTML=rows.length?rows.map(p=>`<article class="post"><div class="row"><h3>${esc(p.title)}</h3>${p.authorId===auth.currentUser.uid?`<button class="danger" onclick="removePost('${p.id}')">공고 내리기</button>`:''}</div><p>${esc(p.body)}</p><span class="meta">${esc(p.author||'')} · ${time(p.createdAt)}</span><button class="soft" onclick="openPostChat('${p.id}','${encodeURIComponent(p.title)}')">공고 문의 대화</button></article>`).join(''):'<div class="empty">아직 등록된 모집공고가 없습니다.</div>'},()=>{$('posts').textContent='게시글을 불러오지 못했습니다.'})}
window.compose=()=>view(`<section class="card"><button class="back" onclick="home()">‹</button><h2>공개 연결글 작성</h2><p class="note">작성한 글은 모든 회원이 볼 수 있습니다.</p><label>제목</label><input id="title" placeholder="예: 폐선 견적 업체를 찾습니다"><label>내용</label><textarea id="body" rows="7" placeholder="선박 상태와 필요한 연결 내용을 작성해 주세요."></textarea><button class="primary" onclick="publish()">연결글 올리기</button></section>`);
window.publish=async()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title||!body)return alert('제목과 내용을 입력해 주세요.');try{await addDoc(collection(db,'posts'),{title,body,author:auth.currentUser.email,authorId:auth.currentUser.uid,role:me.role,createdAt:serverTimestamp()});home()}catch(e){alert('글 저장 실패: '+e.message)}};
window.removePost=async id=>{if(confirm('이 글을 내릴까요?')){try{await deleteDoc(doc(db,'posts',id))}catch(e){alert('글을 내리지 못했습니다.')}}};
window.partners=async()=>{view(`<section><div class="title"><button class="back" onclick="home()">‹</button><h2>대화방 · 등록 조선소/선박</h2></div><p class="note">등록된 조선소와 선박의 위치를 확인하고 1:1 대화하세요.</p><div class="card"><h3>이용 가능 폐선 조선소 안내</h3><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>부산 해양 재활용 조선소</h3><p>폐선 해체·재활용 상담<br>📍 부산광역시 영도구</p></div><button class="soft" onclick="openMap('부산광역시 영도구')">위치 보기</button></article><article class="member company"><div class="avatar">🏗️</div><div class="info"><h3>남해 선박 해체센터</h3><p>선박 매각·해체 견적 상담<br>📍 경상남도 통영시</p></div><button class="soft" onclick="openMap('경상남도 통영시')">위치 보기</button></article></div><h3>등록 회원 대화방</h3><div id="members" class="card">불러오는 중...</div></section>`);try{const ss=await getDocs(collection(db,'profiles')),users=ss.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>x.uid!==auth.currentUser.uid);$('members').innerHTML=users.length?users.map(u=>`<article class="member ${u.role==='company'?'company':''}"><div class="avatar">${u.role==='ship'?'⚓':'🏢'}</div><div class="info"><h3>${esc(u.displayName||u.email)}</h3><p>${u.role==='ship'?'선박':'폐선 조선소'} · ${esc(u.shipyard||'정보 미등록')}<br>📍 ${esc(u.location||'위치 미등록')}</p></div><div><button class="soft" onclick="openMap('${encodeURIComponent(u.location||'')}')">위치 보기</button><button class="primary" onclick="startChat('${u.uid}','${encodeURIComponent(u.displayName||u.email)}')">대화하기</button></div></article>`).join(''):'<div class="empty">아직 다른 회원이 등록되지 않았습니다.</div>'}catch(e){$('members').textContent='회원 목록을 불러오지 못했습니다. Firestore 규칙을 확인해 주세요.'}};
window.openMap=place=>{if(!place)return alert('등록된 위치 정보가 없습니다.');window.open('https://www.google.com/maps/search/?api=1&query='+place,'_blank')};
window.shipyardDetail=kind=>{const data=kind==='busan'?{name:'부산 해양 재활용 조선소',place:'부산광역시 영도구',service:'폐선 해체, 고철·자재 재활용, 해체 일정 상담',prepare:'선박 종류, 톤수, 현재 정박 위치'}:{name:'남해 선박 해체센터',place:'경상남도 통영시',service:'선박 매각 상담, 폐선 견적 검토, 해체 진행 안내',prepare:'선박 규모, 상태, 희망 진행 시기'};view(`<section class="card"><button class="back" onclick="partners()">‹</button><div class="avatar">🏗️</div><h2>${data.name}</h2><p class="note">조선소 서비스 안내</p><p><b>주요 서비스</b><br>${data.service}</p><p><b>상담 전 준비 정보</b><br>${data.prepare}</p><p><b>위치</b><br>📍 ${data.place}</p><div class="row"><button class="primary" onclick="openMap('${data.place}')">지도에서 위치 보기</button><button class="soft" onclick="openSupportChat()">상담하기</button></div></section>`)};
new MutationObserver(()=>document.querySelectorAll('.member.company').forEach(card=>{if(card.dataset.detailReady)return;const title=card.querySelector('h3')?.textContent||'';const kind=title.includes('부산')?'busan':'namhae';card.dataset.detailReady='1';card.classList.add('clickable');card.addEventListener('click',e=>{if(e.target.closest('button'))return;window.shipyardDetail(kind)})})).observe(app,{childList:true,subtree:true});

const botReply=q=>{q=q.toLowerCase();if(q.includes('견적')||q.includes('비용'))return '견적 상담을 위해 선박 종류, 톤수, 현재 위치를 알려주세요.';if(q.includes('절차')||q.includes('폐선'))return '폐선은 상담 신청 → 현장 확인 → 견적 제안 → 계약 → 해체·재활용 순서로 진행됩니다.';if(q.includes('위치')||q.includes('조선소'))return '대화방 메뉴의 이용 가능 폐선 조선소에서 위치 보기 버튼을 눌러 지도를 확인할 수 있습니다.';if(q.includes('회원')||q.includes('가입'))return '회원가입은 아이디와 비밀번호만 입력하면 완료됩니다.';return '안녕하세요, Re:sail 상담 챗봇입니다. 폐선 절차, 견적, 조선소 위치, 회원가입 중 궁금한 내용을 말씀해 주세요.'};

window.publish=async()=>{const title=$('title').value.trim(),body=$('body').value.trim(),file=$('postPhoto')?.files?.[0];if(!title||!body)return alert('제목과 내용을 입력해 주세요.');try{let photoUrl='';if(file){if(file.size>5*1024*1024)return alert('사진은 5MB 이하로 첨부해 주세요.');const fileRef=storageRef(storage,`post-photos/${auth.currentUser.uid}/${Date.now()}-${file.name}`);await uploadBytes(fileRef,file);photoUrl=await getDownloadURL(fileRef)}const authorName=me?.displayName||auth.currentUser.email||'알 수 없는 회원',authorRole=me?.role==='company'?'업체 회원':me?.role==='ship'?'선박 회원':'게스트';await addDoc(collection(db,'posts'),{title,body,photoUrl,author:authorName,authorName,authorRole,authorEmail:auth.currentUser.email||'',authorId:auth.currentUser.uid,role:me.role,reactions:[],createdAt:serverTimestamp()});home()}catch(e){alert('글 저장 실패: '+e.message)}};
window.addReply=async postId=>{const body=prompt('공고에 남길 댓글을 입력하세요.');if(!body?.trim())return;try{await setDoc(doc(db,'threads','post_'+postId),{title:'공고 댓글',members:['public'],createdAt:serverTimestamp()},{merge:true});await addDoc(collection(db,'threads','post_'+postId,'messages'),{body:body.trim(),author:me?.displayName||auth.currentUser.email||'게스트',authorId:auth.currentUser.uid,kind:'comment',createdAt:serverTimestamp()});alert('댓글을 등록했습니다. 공고 문의 대화에서 확인할 수 있습니다.')}catch(e){alert('댓글 등록에 실패했습니다: '+e.message)}};
window.memberDetail=async uid=>{try{const d=(await getDoc(doc(db,'profiles',uid))).data()||{},isCompany=d.role==='company';view(`<section class="card member-detail"><button class="back" onclick="memberChats()">‹</button><div class="member-detail-icon">${isCompany?'🏢':'⚓'}</div><span class="role-badge">${isCompany?'업체 이용자':'선박 이용자'}</span><h2>${esc(d.displayName||d.email||'회원')}</h2><p><b>${isCompany?'업체명':'선박명'}</b><br>${esc(d.shipyard||'정보 미등록')}</p><p><b>위치 정보</b><br>📍 ${esc(d.location||'위치 미등록')}</p><p class="note">이 회원이 등록한 정보입니다. 대화를 시작해 필요한 내용을 문의할 수 있습니다.</p><div class="row"><button class="primary" onclick="startChat('${uid}','${encodeURIComponent(d.displayName||d.email||'회원')}')">대화하기</button><button class="soft" onclick="openMap('${encodeURIComponent(d.location||'')}')">위치 보기</button></div></section>`)}catch(e){alert('회원 정보를 불러오지 못했습니다.')}};
window.memberChats=async()=>{try{const s=await getDocs(collection(db,'profiles')),u=s.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>x.uid!==auth.currentUser.uid);view(`<section><button class="back" onclick="partners()">‹</button><h2>등록 회원</h2><p class="note">아이콘과 유형으로 선박 이용자와 업체 이용자를 구분할 수 있습니다.</p>${u.length?u.map(x=>{const c=x.role==='company';return `<article class="member member-item" onclick="memberDetail('${x.uid}')"><div class="avatar">${c?'🏢':'⚓'}</div><div class="info"><span class="role-badge">${c?'업체 이용자':'선박 이용자'}</span><h3>${esc(x.displayName||x.email)}</h3><p>${c?'폐선 업체':'선박'} · ${esc(x.shipyard||'정보 미등록')}<br>📍 ${esc(x.location||'위치 미등록')}</p></div><button class="primary" onclick="event.stopPropagation();startChat('${x.uid}','${encodeURIComponent(x.displayName||x.email||'회원')}')">대화하기</button></article>`}).join(''):'<div class="empty">등록 회원이 없습니다.</div>'}</section>`)}catch(e){alert('회원 목록을 불러오지 못했습니다.')}};
window.profilePage=()=>view(`<section class="card"><button class="back" onclick="home()">‹</button><h2>👤 마이페이지</h2><div class="profile-summary"><div class="member-detail-icon">${me?.role==='company'?'🏢':'⚓'}</div><span class="role-badge">${me?.role==='company'?'업체 이용자':me?.role==='guest'?'게스트':'선박 이용자'}</span><h3>${esc(me?.displayName||auth.currentUser?.email||'회원')}</h3><p>${me?.role==='company'?'폐선 업체':'선박'} · ${esc(me?.shipyard||'정보 미등록')}<br>📍 ${esc(me?.location||'위치 미등록')}</p></div><p class="note">아래 정보는 다른 회원에게 표시되는 내 등록 정보입니다.</p><label>표시 이름</label><input id="profileName" value="${esc(me?.displayName||'')}"><label>선박명 또는 폐선 조선소명</label><input id="profileYard" value="${esc(me?.shipyard||'')}" placeholder="예: 부산 해양조선"><label>위치</label><input id="profileLocation" value="${esc(me?.location||'')}" placeholder="예: 부산광역시 영도구"><button class="primary" onclick="saveProfile()">정보 저장</button></section>`);
onAuthStateChanged(auth,async u=>{stop();if(!u){me=null;$('user').textContent='선박·폐선 업체 연결 플랫폼';landing();return}await ensureProfile();$('user').innerHTML=`<button class="soft" onclick="profilePage()">👤 마이페이지</button> <button class="soft" onclick="logout()">로그아웃</button>`;home()});Object.assign(window,{landing,authChoice,home,chat});window.logout=()=>signOut(auth);landing();
</script></body></html>
